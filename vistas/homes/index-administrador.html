<!DOCTYPE html>
<!-- Inicio del administrador: su cartera de unidades (US2.5), las que le asignaron los propietarios, con la comisión de cada una. -->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cartera de unidades</title>
        <meta name="description" content="Las unidades que administrás, con su estado y tu comisión">
        <link rel="stylesheet" href="../../estilos/style.css">
        <link rel="stylesheet" href="../../estilos/index-administrador.css">
        <script src="../../funcionalidades/sesion.js" defer></script>
        <script src="../../funcionalidades/menu.js" defer></script>
        <script src="../../funcionalidades/proteger-pagina.js" defer></script>
        <script src="../../funcionalidades/unidades-comun.js" defer></script>
        <script src="../../funcionalidades/cartera-administrador.js" defer></script>
        <link rel="stylesheet" href="../../estilos/aviso-verificacion.css">
        <script src="../../funcionalidades/aviso-verificacion.js" defer></script>
    </head>
    <body data-rol="administrador" hidden>
        <header>
            <nav id="menu" aria-label="Principal"></nav>
            <p class="badge-rol">Administrador</p>
            <a href="../perfil/perfil.html" class="enlace-perfil">Mi perfil</a>
        </header>
        <main>
            <h1 id="titulo-cartera">Cartera de unidades</h1>
            <p id="resumen-cartera" class="subtitulo" aria-live="polite">Cargando tus unidades…</p>

            <p id="mensaje-error" role="alert"></p>

            <p id="cartera-vacia" hidden>Todavía no te asignaron ninguna unidad. Cuando un propietario te asigne una, va a aparecer acá.</p>

            <table id="tabla-cartera" aria-labelledby="titulo-cartera" hidden>
                <thead>
                    <tr>
                        <th scope="col">Unidad</th>
                        <th scope="col">Propietario</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Comisión</th>
                        <th scope="col"><span class="visualmente-oculto">Acciones</span></th>
                    </tr>
                </thead>
                <tbody id="filas-cartera"></tbody>
            </table>
        </main>
    </body>
</html>
