<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alquiler temporario</title>
        <meta name="description" content="Busca unidades disponibles por localidad y fechas">
        <link rel="stylesheet" href="../../estilos/style.css">
        <link rel="stylesheet" href="../../estilos/index-huesped.css">
        <script src="../../funcionalidades/sesion.js" defer></script>
        <script src="../../funcionalidades/menu.js" defer></script>
        <script src="../../funcionalidades/proteger-pagina.js" defer></script>
        <link rel="stylesheet" href="../../estilos/aviso-verificacion.css">
        <script src="../../funcionalidades/aviso-verificacion.js" defer></script>
        <script src="../../funcionalidades/alojamientos.js" defer></script>
    </head>
    <body data-rol="huesped" hidden>
        <header>
            <nav id="menu" aria-label="Principal"></nav>
            <a href="../perfil/perfil.html" class="enlace-perfil">Perfil</a>
        </header>
        <main>
            <h1>Alquiler temporario sin intermediarios</h1>
            <p>Busca por unidades disponibles por localidad y horas</p>
            <form class="form-busqueda" action="../alojamientos/listado.html" method="get">
                <fieldset>
                    <legend>Busqueda de disponibilidad</legend>
                    <label for="localidad">Localidad
                        <select id="localidad" name="localidad">
                            <option value="">Todas</option>
                            <option value="Las Grutas">Las Grutas</option>
                            <option value="Villa Gesell">Villa Gesell</option>
                        </select>
                    </label>
                    <label for="check-in">Check-in
                        <input type="date" id="check-in" name="check-in">
                    </label>
                    <label for="check-out">Check-out
                        <input type="date" id="check-out" name="check-out">
                    </label>
                    <button type="submit" class="boton boton-primario">Buscar disponibilidad</button>
                </fieldset>
            </form>
            <section class="grilla-unidades" id="grilla-alojamientos">
                <h2>Unidades disponibles</h2>
            </section>
        </main>
    </body>
</html>
