<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil usuario</title>
        <meta name="description" content="Mira la informacion de tu perfil">
        <link rel="stylesheet" href="../../estilos/style.css">
        <link rel="stylesheet" href="../../estilos/perfil.css">
        <script src="../../funcionalidades/sesion.js" defer></script>
        <script src="../../funcionalidades/menu.js" defer></script>
        <script src="../../funcionalidades/perfil.js" defer></script>

    </head>
    <body>
        <header>
            <nav id="menu" aria-label="Principal"></nav>
        </header>
        <main>
            <h1 id="saludo-nombre"></h1>
            <section class="tarjeta">
                <h2>Datos de tu cuenta</h2>
                <dl>
                    <dt>Nombre</dt>
                    <dd id="perfil-nombre"></dd>

                    <dt>Mail</dt>
                    <dd id="perfil-mail"></dd>

                    <dt>DNI</dt>
                    <dd>
                        <span id="perfil-dni"></span>
                        <a href="../sesion/completar-datos.html" id="enlace-completar-datos" hidden>Completar mis datos</a>
                    </dd>

                    <dt>Tipo de cuenta</dt>
                    <dd id="perfil-rol"></dd>
                </dl>
            </section>
            <section class="tarjeta" id="seccion-datos-fiscales" hidden>
                <h2>Datos fiscales</h2>
                <p id="fiscal-sin-iva" hidden>No cobra IVA</p>
                <dl id="lista-datos-fiscales" hidden>
                    <dt>CUIT</dt>
                    <dd id="fiscal-cuit"></dd>

                    <dt>Razón social</dt>
                    <dd id="fiscal-razon-social"></dd>

                    <dt>Domicilio fiscal</dt>
                    <dd id="fiscal-domicilio"></dd>
                </dl>
            </section>
            <a href="hacerme-propietario.html" id="enlace-hacerme-propietario" class="boton boton-primario" hidden>Quiero publicar mis alojamientos</a>
            <button type="button" id="boton-cerrar-sesion" class="boton boton-outline">Cerrar sesión</button>
        </main>
    </body>
</html>
