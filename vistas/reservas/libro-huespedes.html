<main>
    <a id="volver-libro" href="mis-reservas.html" class="enlace-volver">← Mis reservas</a>
    <h1 id="titulo-libro" tabindex="-1">Datos de huéspedes</h1>
    <p id="contexto-libro" class="subtitulo"></p>
    <p id="error-libro" role="alert"></p>
    <p id="ok-libro" role="status"></p>
    <p id="cargando-libro" role="status">Cargando huéspedes…</p>
    <button type="button" id="recargar-libro" class="boton boton-secundario" hidden>Volver a cargar</button>
    <section id="indice-libro" hidden aria-labelledby="titulo-lista-libro">
        <h2 id="titulo-lista-libro">Reservas del mes</h2>
        <label for="mes-libro">Mes de la estadía</label>
        <input id="mes-libro" type="month" required>
        <p class="ayuda">Incluye las reservas que transcurren durante este mes.</p>
        <ul id="reservas-libro" class="reservas-libro"></ul>
    </section>
    <section id="detalle-libro" hidden aria-label="Huéspedes de la reserva">
        <div class="resumen-libro"><p id="progreso-libro"></p><a id="exportar-libro" class="boton boton-secundario">Descargar CSV</a></div>
        <p id="ayuda-libro" class="ayuda"></p>
        <form id="form-libro">
            <div id="personas-libro"></div>
            <div id="acciones-libro" class="acciones-libro" hidden>
                <button type="button" id="agregar-huesped" class="boton boton-secundario">Agregar acompañante</button>
                <button type="submit" id="guardar-libro" class="boton boton-primario">Guardar huéspedes</button>
            </div>
        </form>
    </section>
