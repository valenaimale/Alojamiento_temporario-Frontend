<!doctype html>
<!-- "Mis reservas" del huésped (y del propietario, que también es huésped), Épica 4: todas sus reservas, con su
     alojamiento, fechas, importes y estado. Las pendientes de pago se pueden cancelar. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis reservas</title>
    <meta
      name="description"
      content="Tus reservas de alojamiento: fechas, importes y estado"
    />
    <link rel="stylesheet" href="../../estilos/style.css" />
    <link rel="stylesheet" href="../../estilos/mis-reservas.css" />
    <script src="../../funcionalidades/sesion.js" defer></script>
    <script src="../../funcionalidades/menu.js" defer></script>
    <script src="../../funcionalidades/proteger-pagina.js" defer></script>
    <script src="../../funcionalidades/unidades-comun.js" defer></script>
    <script src="../../funcionalidades/mis-reservas.js" defer></script>
    <link rel="stylesheet" href="../../estilos/haylugar.css" />
    <link rel="icon" href="../../imagenes/marca.svg" type="image/svg+xml" />
    <script src="../../funcionalidades/interfaz.js" defer></script>
  </head>
  <body class="pagina-reservas" data-rol="huesped" hidden>
    <header class="site-header">
      <a
        class="marca"
        href="../homes/index-sin-sesion.html"
        aria-label="HayLugar, inicio"
        ><svg viewBox="0 0 32 36" fill="none" aria-hidden="true">
          <path
            d="M5 31V13L16 5l11 8v18H5Z"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <path
            d="M12 31V19h8v12M20 24h.5"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          /></svg
        ><span>HayLugar</span></a
      >
      <nav id="menu" aria-label="Principal"></nav>
      <a href="../perfil/perfil.html" class="enlace-perfil">Mi perfil</a>
    </header>
    <main>
      <h1 id="titulo" tabindex="-1">Mis reservas</h1>
      <p class="subtitulo">Fechas, estado y detalles de tus estadías.</p>
      <div
        class="filtros-reservas"
        id="filtros-reservas"
        role="group"
        aria-label="Mostrar reservas"
        hidden
      >
        <button
          type="button"
          data-filtro-reservas="proximas"
          aria-pressed="true"
        >
          Próximas <span id="cantidad-proximas"></span></button
        ><button
          type="button"
          data-filtro-reservas="historial"
          aria-pressed="false"
        >
          Historial <span id="cantidad-historial"></span>
        </button>
      </div>

      <p id="mensaje-ok" class="mensaje-ok" role="status"></p>
      <p id="mensaje-error" role="alert"></p>
      <p id="cargando" aria-live="polite">Cargando tus reservas…</p>

      <section id="sin-reservas" class="vacio-reservas" hidden>
        <h2 id="titulo-sin-reservas">Tu próxima escapada empieza acá</h2>
        <p id="texto-sin-reservas">
          Elegí un destino y unas fechas para encontrar alojamiento.
        </p>
        <a class="boton boton-primario" href="../homes/index-huesped.html"
          >Explorar alojamientos</a
        >
      </section>
      <p id="resumen-reservas" class="ayuda" role="status"></p>
      <button id="reintentar-reservas" class="boton" type="button" hidden>
        Volver a cargar
      </button>

      <ul class="reservas" id="lista-reservas" aria-labelledby="titulo"></ul>
    </main>
  </body>
</html>
