<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>G-ONE | Registro de administrador de hospedaje</title>
        <meta name="description" content="Creá tu cuenta como administrador de hospedaje en G-ONE">
        <link rel="stylesheet" href="../../estilos/style.css">
        <link rel="stylesheet" href="../../estilos/registro.css">
        <script src="../../funcionalidades/sesion.js" defer></script>
        <script src="../../funcionalidades/registro.js" defer></script>
    </head>
    <body>
        <header></header>
        <main>
            <h1>Creá tu cuenta de administrador de hospedaje</h1>
            <form id="form-registro" data-rol="administrador">
                <label>Nombre completo
                    <input type="text" name="nombre" required>
                </label>
                <label>Mail
                    <input type="email" name="mail" required>
                </label>
                <label>Contraseña
                    <input type="password" name="contrasenia" required minlength="8">
                </label>
                <button type="submit" class="boton boton-primario">Registrarme</button>
            </form>
            <p>¿Ya tenés una cuenta? <a href="../sesion/inicio-sesion.html">Iniciá sesión acá</a>.</p>
        </main>
    </body>
</html>
