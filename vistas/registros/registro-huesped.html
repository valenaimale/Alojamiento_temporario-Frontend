<!DOCTYPE html>
<!-- Registro de un huésped. -->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de huésped</title>
        <meta name="description" content="Creá tu cuenta como huésped en HayLugar">
        <link rel="stylesheet" href="../../estilos/style.css">
        <link rel="stylesheet" href="../../estilos/registro.css">
        <script src="../../funcionalidades/sesion.js" defer></script>
        <script src="../../funcionalidades/registro.js" defer></script>

        <link rel="stylesheet" href="../../estilos/haylugar.css">
        <link rel="icon" href="../../imagenes/marca.svg" type="image/svg+xml">
        <script src="../../funcionalidades/interfaz.js" defer></script>
    </head>
    <body class="cuenta">
        <header class="site-header">
            <a class="marca" href="../homes/index-sin-sesion.html" aria-label="HayLugar, inicio"><svg viewBox="0 0 32 36" fill="none" aria-hidden="true"><path d="M5 31V13L16 5l11 8v18H5Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M12 31V19h8v12M20 24h.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>HayLugar</span></a></header>
        <main>
            <h1>Creá tu cuenta de huésped</h1>
            <form id="form-registro" data-rol="huesped" >
                <label>Nombre completo
                    <input type="text" name="nombre" autocomplete="name" required>
                </label>
                <label>DNI
                    <input type="text" name="dni" inputmode="numeric" required>
                </label>
                <h2 class="form-seccion">Acceso a tu cuenta</h2>
                <label>Mail
                    <input type="email" name="mail" autocomplete="email" required>
                </label>
                <label>Repetí tu mail
                    <input type="email" name="mail_confirmacion" required autocomplete="off" >
                </label>
                <label>Contraseña
                    <input type="password" name="contrasenia" autocomplete="new-password" required minlength="8">
                </label>
                <label>Repetí tu contraseña
                    <input type="password" name="contrasenia_confirmacion" required minlength="8" autocomplete="off" >
                </label>
                <button type="submit" class="boton boton-primario">Registrarme</button>
            </form>
            <p id="mensaje-error" role="alert"></p>
            <p>¿Ya tenés una cuenta? <a href="../sesion/inicio-sesion.html">Iniciá sesión acá</a>.</p>
        </main>
        <footer class="site-footer"><strong>HayLugar</strong><span>Alojamientos temporarios</span></footer>
    </body>
</html>
