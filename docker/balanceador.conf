upstream front {
    zone replicas 64k;
    server front1:80 max_fails=1 fail_timeout=3s;
    server front2:80 max_fails=1 fail_timeout=3s;
}

server {
    listen 80;
    location / {
        proxy_pass http://front;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
