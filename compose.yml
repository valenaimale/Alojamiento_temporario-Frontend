# Dos réplicas del front estático detrás de un balanceador nginx, para probar el escalado en local.
# Las dos réplicas usan la misma imagen: la construye front1 y front2 la reutiliza. Si las dos la construyeran a la
# vez con el mismo nombre, la segunda fallaría con "image already exists".
x-front: &front
  image: haylugar-frontend:local

services:
  front1:
    <<: *front
    build: .
    hostname: front1
  front2:
    <<: *front
    pull_policy: never   # la imagen es local (la construye front1): no se busca en Docker Hub
    hostname: front2
    depends_on: [front1]
  balanceador:
    image: nginx:alpine
    volumes:
      - ./docker/balanceador.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FRONT_PORT:-5500}:80"
    depends_on: [front1, front2]
